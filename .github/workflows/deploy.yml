name: 更新数据并部署到 GitHub Pages

on:
  schedule:
    # 每天 UTC 08:30 运行（北京时间 16:30）— 收市后统一更新
    - cron: "30 8 * * *"
    # 每天 UTC 12:30 运行（北京时间 20:30）— 晚间重试, 数据源对GitHub服务器IP间歇性拦截时自动补漏
    - cron: "30 12 * * *"
    # 每天 UTC 00:00 运行（北京时间 08:00）— 早间补漏, 确保开盘前页面已是最新收盘数据
    - cron: "0 0 * * *"
    # 工作日 UTC 06:25（北京时间 14:25）— "历史上的今天" 盘中快照, 抢在 15:00 收盘前完成
    - cron: "25 6 * * 1-5"
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]

# Pages 只能串行部署, 两个 job 共用同一 concurrency group 避免互相取消
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # 14:25 那次只跑盘中快照 job, 全量收盘流程跳过
    if: github.event.schedule != '25 6 * * 1-5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      # deploy-pages 需要用工作流令牌列出本次运行的 artifact, 缺少 actions: read 会
      # 报 "No artifacts named github-pages were found"(实际已上传成功)导致部署失败
      actions: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          # 锁定 akshare 版本: 2026-11-14 起 1.20.43+ 移除了 stock_zh_index_daily_em/sina/tx,
          # 1.20.41+ 移除了 bond_zh_us_rate, 不锁版本会导致所有指数行情/国债收益率静默断更。
          # 1.20.39 是同时包含上述全部接口的最后一个版本。
          pip install pandas numpy "akshare==1.20.39" requests

      # fetch_rsrs.py 先运行：更新xlsx（OHLCV + PE_TTM + 国债）+ 输出RSRS回测数据
      - name: 更新xlsx并生成RSRS数据
        run: python fetch_rsrs.py

      # fetch_data.py 后运行：从已更新的xlsx读取数据，输出股债性价比和格雷厄姆指数
      - name: 生成股债性价比和格雷厄姆指数数据
        run: python fetch_data.py

      # fetch_ma200.py：从已更新的xlsx读取中证500/中证1000现货收盘，输出MA200择时活数据
      - name: 生成MA200择时活数据
        run: python fetch_ma200.py

      # gen_ma200_backtest.py：akshare拉IC/IM股指期货→重建近月净值→回测曲线延伸到最新交易日
      - name: 生成MA200回测曲线(动态延伸)
        run: python gen_ma200_backtest.py

      # fetch_v6_futures.py：中金所月度归档 → IH/IF/IC/IM 全部月份合约日收盘（增量）。
      # 数据源对海外IP可能间歇性拦截, 失败时继续使用仓库内已有 csv, 不阻断部署。
      - name: 更新V6股指期货全月份合约数据
        continue-on-error: true
        run: python fetch_v6_futures.py

      # gen_v6_backtest.py：按《V6策略说明文档.md》回测 → 输出 v6_backtest.js / v6_live.js
      - name: 生成V6基差轮动回测与实时持仓数据
        run: python gen_v6_backtest.py

      # fetch_etf_nt.py：上交所/深交所份额 + 新浪价格/持有人 → data/etf_nt_data.js
      # 接口对海外IP可能间歇性拦截, 失败时沿用仓库内已有数据, 不阻断部署
      - name: 更新ETF国家队看板数据
        continue-on-error: true
        run: python fetch_etf_nt.py

      # fetch_sentiment.py：akshare 两融余额/融资净买入 + 50ETF 波指 → data/情绪数据序列.xlsx
      # 供 "历史上的今天" 的情绪维度使用; 失败时沿用旧 sheet, 不阻断部署
      - name: 更新两融与波指情绪数据
        continue-on-error: true
        run: python fetch_sentiment.py

      # 隐含波动率/fetch_iv.py：中金所 MO 期权结算价 → Black-76 反算中证1000 IV（增量）。
      # 首次运行回填 2022-07 起全部月份，之后只重算最近 3 个月；失败不阻断部署。
      - name: 反算中证1000隐含波动率
        continue-on-error: true
        run: python 隐含波动率/fetch_iv.py

      # 历史上的今天/analog_core.py：8 维状态相似日匹配 → 各期限上涨概率与涨跌空间。
      # 依赖前面的 xlsx / v6_futures / iv 更新; 失败时沿用仓库内已有 analog_data.js。
      - name: 生成相似日概率与空间推算
        continue-on-error: true
        run: python 历史上的今天/analog_core.py

      - name: 提交更新的数据文件（跳过 CI 防循环）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add fetch_rsrs.py
          git add "隐含波动率/iv_history.csv"
          git add "历史上的今天/"
          git diff --cached --quiet || git commit -m "chore: 每日数据更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Pages 产物
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 最后一步: 数据源状态检查。OHLCV全源失败时任务标红, GitHub会发送失败邮件通知,
      # 但数据提交/部署已在前面的步骤完成, 不影响线上页面
      - name: 数据源状态检查
        run: python -c "import json,sys; s=json.load(open('data/fetch_status.json',encoding='utf-8')); print(s.get('detail','数据源正常')); sys.exit(0 if s.get('ok') else 1)"

  # ------------------------------------------------------------------
  # 盘中快照 job: 北京时间 14:25 触发, 用实时价重算"历史上的今天"的概率与空间
  # 只写 历史上的今天/analog_snapshots.js, 不碰训练样本, 当天多次运行只保留最后一次
  # ------------------------------------------------------------------
  snapshot-1430:
    if: github.event.schedule == '25 6 * * 1-5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      # deploy-pages 需要用工作流令牌列出本次运行的 artifact, 缺少 actions: read 会
      # 报 "No artifacts named github-pages were found"(实际已上传成功)导致部署失败
      actions: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # openpyxl 必需: 快照要读取 data/*.xlsx, 缺少时 pandas 会直接抛 ImportError
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests openpyxl

      # 东方财富实时行情为主, 腾讯兜底; 全部失败时保持原有快照不变
      - name: 生成 14:30 盘中快照
        continue-on-error: true
        run: python 历史上的今天/snapshot_1430.py

      - name: 提交快照文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "历史上的今天/analog_snapshots.js"
          git diff --cached --quiet || git commit -m "chore: 14:30 相似日快照 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
