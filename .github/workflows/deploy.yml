name: 更新数据并部署到 GitHub Pages

on:
  schedule:
    # 每天 UTC 08:30 运行（北京时间 16:30）— 收市后统一更新
    - cron: "30 8 * * *"
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pandas numpy akshare

      # fetch_rsrs.py 先运行：更新xlsx（OHLCV + PE_TTM + 国债）+ 输出RSRS回测数据
      - name: 更新xlsx并生成RSRS数据
        run: python fetch_rsrs.py

      # fetch_data.py 后运行：从已更新的xlsx读取数据，输出股债性价比和格雷厄姆指数
      - name: 生成股债性价比和格雷厄姆指数数据
        run: python fetch_data.py

      - name: 提交更新的数据文件（跳过 CI 防循环）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add fetch_rsrs.py
          git diff --cached --quiet || git commit -m "chore: 每日数据更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Pages 产物
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
