name: 更新数据并部署到 GitHub Pages

on:
  schedule:
    # 每天 UTC 08:30 运行（北京时间 16:30）— 收市后统一更新
    - cron: "30 8 * * *"
    # 每天 UTC 12:30 运行（北京时间 20:30）— 晚间重试, 数据源对GitHub服务器IP间歇性拦截时自动补漏
    - cron: "30 12 * * *"
    # 每天 UTC 00:00 运行（北京时间 08:00）— 早间补漏, 确保开盘前页面已是最新收盘数据
    - cron: "0 0 * * *"
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pandas numpy akshare

      # fetch_rsrs.py 先运行：更新xlsx（OHLCV + PE_TTM + 国债）+ 输出RSRS回测数据
      - name: 更新xlsx并生成RSRS数据
        run: python fetch_rsrs.py

      # fetch_data.py 后运行：从已更新的xlsx读取数据，输出股债性价比和格雷厄姆指数
      - name: 生成股债性价比和格雷厄姆指数数据
        run: python fetch_data.py

      # fetch_ma200.py：从已更新的xlsx读取中证500/中证1000现货收盘，输出MA200择时活数据
      - name: 生成MA200择时活数据
        run: python fetch_ma200.py

      # gen_ma200_backtest.py：akshare拉IC/IM股指期货→重建近月净值→回测曲线延伸到最新交易日
      - name: 生成MA200回测曲线(动态延伸)
        run: python gen_ma200_backtest.py

      - name: 提交更新的数据文件（跳过 CI 防循环）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add fetch_rsrs.py
          git diff --cached --quiet || git commit -m "chore: 每日数据更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Pages 产物
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 最后一步: 数据源状态检查。OHLCV全源失败时任务标红, GitHub会发送失败邮件通知,
      # 但数据提交/部署已在前面的步骤完成, 不影响线上页面
      - name: 数据源状态检查
        run: python -c "import json,sys; s=json.load(open('data/fetch_status.json',encoding='utf-8')); print(s.get('detail','数据源正常')); sys.exit(0 if s.get('ok') else 1)"
